[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "sva-bench"
version = "0.1.0a1"
description = "SCPI acquisition tools for the SIGLENT SVA1000X"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]

[project.optional-dependencies]
usb = ["pyvisa"]

[project.scripts]
sva = "sva_bench.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
